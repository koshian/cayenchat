[workspace]
members = [
  "crates/model",
  "crates/irc-core",
  "crates/storage",
  "crates/upload",
  "crates/media",
  "crates/app",
  "crates/ui",
]
default-members = ["crates/ui"]
resolver = "3"

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
cayenchat-model = { path = "crates/model" }
cayenchat-app = { path = "crates/app" }
cayenchat-irc-core = { path = "crates/irc-core" }
cayenchat-upload = { path = "crates/upload" }
cayenchat-media = { path = "crates/media" }
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
irc = { version = "=1.1.0", default-features = false, features = ["tls-rust", "channel-lists"] }
# Legacy charsets: `irc`'s own `encoding` feature would pull in the
# unmaintained `encoding` crate (it uses it only for mock connections), so the
# vendored irc-proto's codec feature is enabled directly; it uses encoding_rs.
irc-proto = { version = "=1.1.0", default-features = false, features = ["encoding"] }
encoding_rs = "0.8.33"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"

[patch.crates-io]
# GPUI 0.2.2 predates upstream's Windows language-key/IME message handling fix.
gpui = { path = "vendor/gpui" }
# The published client panics on COMPOUND_TEXT it cannot decode (Mozc via IBus).
zed-xim = { path = "vendor/zed-xim" }
# The published codec buffers a line without any length limit and decodes
# legacy charsets with the unmaintained `encoding` crate.
irc-proto = { path = "vendor/irc-proto" }
# ClientStream::close ends the sending side (FIN after QUIT) and drains the server before the socket is dropped.
irc = { path = "vendor/irc" }

[profile.dev]
debug = 1

# Versioned releases only (release.yml); the rolling beta and test builds use
# `release`, which builds much faster. On Linux x86_64 this took the binary
# from 55.3 MB (41.6 MB stripped) to 28.6 MB.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
