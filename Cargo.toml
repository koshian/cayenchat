[workspace]
members = ["crates/model", "crates/irc-core", "crates/storage", "crates/app", "crates/ui"]
default-members = ["crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
cayenchat-model = { path = "crates/model" }
cayenchat-app = { path = "crates/app" }
cayenchat-irc-core = { path = "crates/irc-core" }
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
irc = { version = "=1.1.0", default-features = false, features = ["tls-rust", "channel-lists", "encoding"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
encoding = "0.2"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"

[patch.crates-io]
# GPUI 0.2.2 predates upstream's Windows language-key/IME message handling fix.
gpui = { path = "vendor/gpui" }

[profile.dev]
debug = 1
