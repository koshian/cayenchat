name: Beta Release

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

# Build jobs run third-party build scripts, so only the publish job can write.
permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    name: Package Linux x86_64
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: target/debian/*.deb
          if-no-files-found: error

  windows-x86_64:
    name: Package Windows x86_64
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: windows-latest

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\locales
          Copy-Item target\release\cayenchat.exe package\
          Copy-Item locales\*.json package\locales\
          Compress-Archive `
            -Path package\* `
            -DestinationPath cayenchat-windows-x86_64.zip

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: cayenchat-windows-x86_64.zip
          if-no-files-found: error

  windows-arm64:
    name: Package Windows ARM64
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: windows-11-arm

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\locales
          Copy-Item target\release\cayenchat.exe package\
          Copy-Item locales\*.json package\locales\
          Compress-Archive `
            -Path package\* `
            -DestinationPath cayenchat-windows-arm64.zip

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-arm64
          path: cayenchat-windows-arm64.zip
          if-no-files-found: error

  macos-arm64:
    name: Package macOS ARM64
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: macos-latest

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create app bundle
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"

          mkdir -p CayenChat.app/Contents/MacOS CayenChat.app/Contents/Resources/locales
          cp target/release/cayenchat CayenChat.app/Contents/MacOS/CayenChat
          cp crates/ui/resources/macos/CayenChat.icns CayenChat.app/Contents/Resources/CayenChat.icns
          cp locales/*.json CayenChat.app/Contents/Resources/locales/
          chmod +x CayenChat.app/Contents/MacOS/CayenChat

          cat > CayenChat.app/Contents/Info.plist <<EOF_PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>CayenChat</string>
            <key>CFBundleDisplayName</key>
            <string>CayenChat</string>
            <key>CFBundleIdentifier</key>
            <string>com.cayenchat.app</string>
            <key>CFBundleExecutable</key>
            <string>CayenChat</string>
            <key>CFBundleIconFile</key>
            <string>CayenChat</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
          </dict>
          </plist>
          EOF_PLIST

          # Seal the completed app bundle.
          codesign --force --sign - CayenChat.app
          codesign --verify --deep --strict --verbose=2 CayenChat.app

          ditto -c -k --sequesterRsrc --keepParent \
            CayenChat.app cayenchat-macos-arm64.zip

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64
          path: cayenchat-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish rolling beta
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    needs:
      - linux-x86_64
      - windows-x86_64
      - windows-arm64
      - macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Point beta tag at tested commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f beta "$SHA"
          git push origin refs/tags/beta --force

      - name: Set release metadata
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      - name: Create or update beta release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta \
              --title "CayenChat Beta ${BUILD_DATE} (${SHORT_SHA})" \
              --target "$SHA" \
              --prerelease \
              --latest=false \
              --notes "Rolling beta build from master (${SHA})."
          else
            gh release create beta \
              --title "CayenChat Beta ${BUILD_DATE} (${SHORT_SHA})" \
              --target "$SHA" \
              --prerelease \
              --latest=false \
              --notes "Rolling beta build from master (${SHA})."
          fi

          gh release upload beta dist/* --clobber
