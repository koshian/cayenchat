name: Beta Release

on:
  # 05:00 and 17:00 JST. GitHub may start scheduled runs late.
  schedule:
    - cron: "0 20,8 * * *"
  workflow_dispatch:

# Build jobs run third-party build scripts, so only the publish job can write.
permissions:
  contents: read

# A running run is never cancelled, so it never replaces the beta half way;
# a waiting run is replaced by a newer one. Each run picks the master HEAD
# when it starts.
concurrency:
  group: beta-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Choose commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.choose.outputs.sha }}
      publish: ${{ steps.choose.outputs.publish }}

    steps:
      # Only the latest master HEAD is ever published, never another ref. The
      # beta tag moves last in `publish`, so it names the last complete beta.
      - name: Choose commit to publish
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::Run this workflow on master, not ${REF}."
            exit 1
          fi
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "publish=false" >> "$GITHUB_OUTPUT"

          beta=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/beta" --jq .object.sha 2>/dev/null || true)
          if [ "$beta" = "$sha" ]; then
            echo "::notice::beta already points at ${sha}; nothing to publish."
            exit 0
          fi

          # CI of this very commit must have passed; an unrelated success
          # of another commit does not count.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch master --event push --commit "$sha" \
            --json status,conclusion)
          echo "CI runs for ${sha}: ${runs}"
          if [ "$(jq 'any(.conclusion == "success")' <<<"$runs")" != true ]; then
            echo "::warning::CI has not succeeded for ${sha} (missing, running, failed or cancelled); not publishing."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish rolling beta
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Set release metadata
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      # The release must already exist: creating it here would create the beta
      # tag before the upload, and a failed upload would then look published.
      - name: Update beta release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            echo "::error::The beta release does not exist. Create it once by hand (a prerelease on the beta tag) and run this workflow again."
            exit 1
          fi
          gh release edit beta \
            --title "CayenChat Beta ${BUILD_DATE} (${SHORT_SHA})" \
            --target "$SHA" \
            --prerelease \
            --latest=false \
            --notes "Rolling beta build from master (${SHA})."

          # Upload first so a failed upload never leaves the release empty,
          # then drop assets from older builds whose names no longer exist.
          gh release upload beta dist/* --clobber

          gh release view beta --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [ ! -e "dist/${asset}" ]; then
                gh release delete-asset beta "$asset" --yes
              fi
            done

      # Last, so a failed run leaves the tag on the previous beta and the
      # next run publishes again.
      - name: Point beta tag at tested commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f beta "$SHA"
          git push origin refs/tags/beta --force
