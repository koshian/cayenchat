name: Beta Release

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

# Build jobs run third-party build scripts, so only the publish job can write.
permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}

  publish:
    name: Publish rolling beta
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Point beta tag at tested commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f beta "$SHA"
          git push origin refs/tags/beta --force

      - name: Set release metadata
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      - name: Create or update beta release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta \
              --title "CayenChat Beta ${BUILD_DATE} (${SHORT_SHA})" \
              --target "$SHA" \
              --prerelease \
              --latest=false \
              --notes "Rolling beta build from master (${SHA})."
          else
            gh release create beta \
              --title "CayenChat Beta ${BUILD_DATE} (${SHORT_SHA})" \
              --target "$SHA" \
              --prerelease \
              --latest=false \
              --notes "Rolling beta build from master (${SHA})."
          fi

          # Upload first so a failed upload never leaves the release empty,
          # then drop assets from older builds whose names no longer exist.
          gh release upload beta dist/* --clobber

          gh release view beta --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [ ! -e "dist/${asset}" ]; then
                gh release delete-asset beta "$asset" --yes
              fi
            done
