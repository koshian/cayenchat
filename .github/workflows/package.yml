name: Package

# Builds and packages CayenChat. Shared by Beta Release and Test Build so a
# packaging change is made in one place. Not meant to be started by hand.
#
# With `test` off the packages are the regular ones, uploaded as one archived
# artifact per platform (named after the platform) for the beta to publish.
# With `test` on they are the Test Build packages: named after the commit,
# installable beside nothing else (see spec/development.md), uploaded as the
# bare file and kept for 7 days.

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit SHA to build
        required: true
        type: string
      platform:
        description: >-
          all, windows-x86_64, windows-arm64, linux-x86_64 or macos-arm64
        required: false
        type: string
        default: all
      test:
        description: Produce Test Build packages instead of regular ones
        required: false
        type: boolean
        default: false
      isolated:
        description: Build with the test-build feature (Test Build only)
        required: false
        type: boolean
        default: false
      prefix:
        description: File name prefix of the regular packages
        required: false
        type: string
        default: cayenchat
      profile:
        description: >-
          Cargo profile: release (beta and test builds) or dist (versioned
          releases: fat LTO, one codegen unit, stripped)
        required: false
        type: string
        default: release

# The build runs code from an arbitrary ref, so the token can only read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FEATURES: ${{ inputs.isolated && 'cayenchat-ui/test-build' || '' }}
  SUFFIX: ${{ inputs.isolated && '-isolated' || '' }}
  TEST: ${{ inputs.test && 'true' || 'false' }}
  PREFIX: ${{ inputs.prefix }}
  BUILD_PROFILE: ${{ inputs.profile }}

jobs:
  linux-x86_64:
    name: Package Linux x86_64
    if: inputs.platform == 'all' || inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the package
        shell: bash
        run: |
          if [ "$TEST" = true ]; then
            echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-linux-x86_64${SUFFIX}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE=${PREFIX}-linux-x86_64" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      # Pinned: the packaging tool writes the published .deb, so a new
      # release is taken only by changing this version on purpose.
      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      # Pinned like cargo-deb: the notices are distributed, so a new release
      # is taken only by changing this version on purpose.
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      # Written to the repository root, where the .deb assets pick it up.
      - name: Generate third-party licenses
        run: cargo about generate --locked --manifest-path crates/ui/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Build release binary
        run: cargo build --profile "$BUILD_PROFILE" --locked ${FEATURES:+--features "$FEATURES"}

      - name: Build Debian package
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$TEST" != true ]; then
            # cargo-deb names the file after the Debian version, which has a
            # `~` in a pre-release; GitHub rewrites that in asset names.
            cargo deb --no-build --profile "$BUILD_PROFILE"
            mv target/debian/*.deb "$PACKAGE.deb"
            exit 0
          fi
          # The variant is defined here, not read from the ref, so that refs
          # branched before it existed can be packaged too. It installs the
          # same paths as the regular package, so the two conflict. Its
          # licenses go to its own documentation directory, so `assets` repeats
          # the list in crates/ui/Cargo.toml with that directory renamed.
          cat >> crates/ui/Cargo.toml <<'EOF_VARIANT'

          [package.metadata.deb.variants.test]
          name = "cayenchat-test"
          conflicts = "cayenchat-ui"
          assets = [
            ["target/release/cayenchat", "usr/bin/", "755"],
            ["../../locales/*.json", "usr/share/cayenchat/locales/", "644"],
            ["../../assets/linux/cayenchat.desktop", "usr/share/applications/", "644"],
            ["../../assets/icons/cayenchat.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
            ["../../LICENSE", "usr/share/doc/cayenchat-test/", "644"],
            ["../../THIRD_PARTY_NOTICES.md", "usr/share/doc/cayenchat-test/", "644"],
            ["../../THIRD_PARTY_LICENSES.html", "usr/share/doc/cayenchat-test/", "644"],
            ["../../licenses/*", "usr/share/doc/cayenchat-test/licenses/", "644"],
          ]
          EOF_VARIANT
          cargo deb --no-build --profile "$BUILD_PROFILE" --variant test
          mv target/debian/*.deb "$PACKAGE.deb"

      - name: Upload package
        if: inputs.test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PACKAGE }}.deb
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload package
        if: ${{ !inputs.test }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: ${{ env.PACKAGE }}.deb
          if-no-files-found: error

  windows-x86_64:
    name: Package Windows x86_64
    if: inputs.platform == 'all' || inputs.platform == 'windows-x86_64'
    runs-on: windows-latest

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the package
        shell: bash
        run: |
          if [ "$TEST" = true ]; then
            echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-windows-x86_64${SUFFIX}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE=${PREFIX}-windows-x86_64" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        shell: bash
        run: cargo build --profile "$BUILD_PROFILE" --locked ${FEATURES:+--features "$FEATURES"}

      # Pinned like cargo-deb: the notices are distributed, so a new release
      # is taken only by changing this version on purpose.
      - name: Install cargo-about
        shell: bash
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Generate third-party licenses
        shell: bash
        run: cargo about generate --locked --manifest-path crates/ui/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\locales
          Copy-Item "target\$env:BUILD_PROFILE\cayenchat.exe" package\
          Copy-Item locales\*.json package\locales\
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.html package\
          Copy-Item licenses package\licenses -Recurse
          Compress-Archive `
            -Path package\* `
            -DestinationPath "$env:PACKAGE.zip"

      - name: Upload package
        if: inputs.test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PACKAGE }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload package
        if: ${{ !inputs.test }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

  windows-arm64:
    name: Package Windows ARM64
    if: inputs.platform == 'all' || inputs.platform == 'windows-arm64'
    runs-on: windows-11-arm

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the package
        shell: bash
        run: |
          if [ "$TEST" = true ]; then
            echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-windows-arm64${SUFFIX}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE=${PREFIX}-windows-arm64" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        shell: bash
        run: cargo build --profile "$BUILD_PROFILE" --locked ${FEATURES:+--features "$FEATURES"}

      # Pinned like cargo-deb: the notices are distributed, so a new release
      # is taken only by changing this version on purpose.
      - name: Install cargo-about
        shell: bash
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Generate third-party licenses
        shell: bash
        run: cargo about generate --locked --manifest-path crates/ui/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\locales
          Copy-Item "target\$env:BUILD_PROFILE\cayenchat.exe" package\
          Copy-Item locales\*.json package\locales\
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.html package\
          Copy-Item licenses package\licenses -Recurse
          Compress-Archive `
            -Path package\* `
            -DestinationPath "$env:PACKAGE.zip"

      - name: Upload package
        if: inputs.test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PACKAGE }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload package
        if: ${{ !inputs.test }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

  macos-arm64:
    name: Package macOS ARM64
    if: inputs.platform == 'all' || inputs.platform == 'macos-arm64'
    runs-on: macos-latest

    steps:
      # Full history: CFBundleVersion is the commit count.
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Name the package
        shell: bash
        run: |
          if [ "$TEST" = true ]; then
            echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-macos-arm64${SUFFIX}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE=${PREFIX}-macos-arm64" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --profile "$BUILD_PROFILE" --locked ${FEATURES:+--features "$FEATURES"}

      # Pinned like cargo-deb: the notices are distributed, so a new release
      # is taken only by changing this version on purpose.
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Generate third-party licenses
        run: cargo about generate --locked --manifest-path crates/ui/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.html

      # The Test Build bundle has a separate name and identifier, so that it
      # is never mistaken for (or dragged over) an installed CayenChat.app.
      - name: Create app bundle
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          # Apple's version keys take dot-separated numbers only, so the SemVer
          # pre-release suffix is dropped from the marketing version and the
          # commit count (rc.1 < rc.2 < final on master) is the build version.
          SHORT_VERSION="${VERSION%%[-+]*}"
          BUILD_VERSION="$(git rev-list --count HEAD)"
          if [ "$TEST" = true ]; then
            NAME="CayenChat Test"
            IDENTIFIER="com.cayenchat.test"
          else
            NAME="CayenChat"
            IDENTIFIER="com.cayenchat.app"
          fi
          APP="$NAME.app"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/locales"
          cp "target/$BUILD_PROFILE/cayenchat" "$APP/Contents/MacOS/CayenChat"
          cp crates/ui/resources/macos/CayenChat.icns "$APP/Contents/Resources/CayenChat.icns"
          cp locales/*.json "$APP/Contents/Resources/locales/"
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html "$APP/Contents/Resources/"
          cp -R licenses "$APP/Contents/Resources/licenses"
          chmod +x "$APP/Contents/MacOS/CayenChat"

          cat > "$APP/Contents/Info.plist" <<EOF_PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>${IDENTIFIER}</string>
            <key>CFBundleExecutable</key>
            <string>CayenChat</string>
            <key>CFBundleIconFile</key>
            <string>CayenChat</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${SHORT_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${BUILD_VERSION}</string>
          </dict>
          </plist>
          EOF_PLIST

          plutil -lint "$APP/Contents/Info.plist"
          for KEY in CFBundleShortVersionString CFBundleVersion; do
            VALUE="$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Contents/Info.plist")"
            if ! [[ "$VALUE" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::$KEY is not a numeric bundle version: $VALUE"
              exit 1
            fi
          done

          # Seal the completed app bundle.
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$PACKAGE.zip"

      - name: Upload package
        if: inputs.test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PACKAGE }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload package
        if: ${{ !inputs.test }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error
