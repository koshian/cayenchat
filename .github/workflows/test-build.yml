name: Test Build

# Packages any branch, tag or commit for someone to try before it is merged.
# Run it from the Actions tab or with
#   gh workflow run test-build.yml -f ref=<branch or SHA> -f platform=<platform>
# Only people with write access can start it. The packages are workflow
# artifacts kept for 7 days; nothing is published or released.
run-name: Test Build ${{ inputs.ref }} (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to build
        required: true
        type: string
      platform:
        description: Platform to package
        required: true
        type: choice
        default: windows-x86_64
        options:
          - all
          - windows-x86_64
          - windows-arm64
          - linux-x86_64
          - macos-arm64
      isolated:
        description: >-
          Build with the test-build feature (fresh settings on every launch,
          separate credential store)
        required: false
        type: boolean
        default: false

# The build runs code from an arbitrary ref, so the token can only read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FEATURES: ${{ inputs.isolated && 'cayenchat-ui/test-build' || '' }}
  SUFFIX: ${{ inputs.isolated && '-isolated' || '' }}

jobs:
  linux-x86_64:
    name: Package Linux x86_64
    if: inputs.platform == 'all' || inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the package after the commit
        shell: bash
        run: echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-linux-x86_64${SUFFIX}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release --locked --features "$FEATURES"

      - name: Build Debian package
        shell: bash
        run: |
          set -euxo pipefail
          cargo deb --no-build --variant test
          mv target/debian/*.deb "$PACKAGE.deb"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PACKAGE }}.deb
          archive: false
          retention-days: 7
          if-no-files-found: error

  windows-x86_64:
    name: Package Windows x86_64
    if: inputs.platform == 'all' || inputs.platform == 'windows-x86_64'
    runs-on: windows-latest

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the package after the commit
        shell: bash
        run: echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-windows-x86_64${SUFFIX}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --features "$FEATURES"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\locales
          Copy-Item target\release\cayenchat.exe package\
          Copy-Item locales\*.json package\locales\
          Compress-Archive `
            -Path package\* `
            -DestinationPath "$env:PACKAGE.zip"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PACKAGE }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

  windows-arm64:
    name: Package Windows ARM64
    if: inputs.platform == 'all' || inputs.platform == 'windows-arm64'
    runs-on: windows-11-arm

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the package after the commit
        shell: bash
        run: echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-windows-arm64${SUFFIX}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --features "$FEATURES"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\locales
          Copy-Item target\release\cayenchat.exe package\
          Copy-Item locales\*.json package\locales\
          Compress-Archive `
            -Path package\* `
            -DestinationPath "$env:PACKAGE.zip"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PACKAGE }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

  macos-arm64:
    name: Package macOS ARM64
    if: inputs.platform == 'all' || inputs.platform == 'macos-arm64'
    runs-on: macos-latest

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the package after the commit
        shell: bash
        run: echo "PACKAGE=cayenchat-test-$(git rev-parse --short=7 HEAD)-macos-arm64${SUFFIX}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --locked --features "$FEATURES"

      # A separate name and identifier, so that the bundle is never mistaken
      # for (or dragged over) an installed CayenChat.app.
      - name: Create app bundle
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          NAME="CayenChat Test"
          APP="$NAME.app"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/locales"
          cp target/release/cayenchat "$APP/Contents/MacOS/CayenChat"
          cp crates/ui/resources/macos/CayenChat.icns "$APP/Contents/Resources/CayenChat.icns"
          cp locales/*.json "$APP/Contents/Resources/locales/"
          chmod +x "$APP/Contents/MacOS/CayenChat"

          cat > "$APP/Contents/Info.plist" <<EOF_PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>com.cayenchat.test</string>
            <key>CFBundleExecutable</key>
            <string>CayenChat</string>
            <key>CFBundleIconFile</key>
            <string>CayenChat</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
          </dict>
          </plist>
          EOF_PLIST

          # Seal the completed app bundle.
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$PACKAGE.zip"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PACKAGE }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: error
