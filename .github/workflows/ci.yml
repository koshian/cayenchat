name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Windows x86_64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS ARM64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build
        run: cargo build --workspace --locked --verbose

      # Verify the release artifact too: Rust defaults to the console
      # subsystem, and that metadata is the cause of the startup terminal.
      - name: Verify Windows release subsystem
        if: matrix.name == 'Windows x86_64'
        shell: pwsh
        run: |
          cargo build --release --locked -p cayenchat-ui
          ./scripts/check-windows-subsystem.ps1 target/release/cayenchat.exe
          $expected = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json |
            ForEach-Object { $_.packages[0].version }
          $info = (Get-Item target/release/cayenchat.exe).VersionInfo
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) {
            throw "Expected version $expected, found $($info.FileVersion) / $($info.ProductVersion)"
          }

      # Builds and signs the throw-away MSIX used to check the packaged
      # login-startup backend (#153); makeappx validates the manifest.
      - name: Build test MSIX
        if: matrix.name == 'Windows x86_64'
        shell: pwsh
        run: ./scripts/msix-test/build.ps1 -Exe target/release/cayenchat.exe

      - name: Upload test MSIX
        if: matrix.name == 'Windows x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-test
          path: |
            target/tmp/msix-test/CayenChat.Test.msix
            target/tmp/msix-test/test.cer
          if-no-files-found: error

      # The default member is only the UI crate; test every crate so storage,
      # upload, irc-core and app also run on each platform.
      - name: Test
        run: cargo test --workspace --locked --verbose

      # Probes the real Windows Credential Manager through the keyring crate.
      - name: Test system credential store
        if: runner.os == 'Windows'
        run: cargo test -p cayenchat-storage --locked -- --ignored --nocapture

  # The real app under a virtual X display (Xvfb, software Vulkan) against a
  # local Ergo: older history pages keep the view in place, and a reconnect
  # recovers the missed lines where the log was cut off. Linux only: it drives
  # the app with X11 tools (spec/development.md, "GUI end-to-end test").
  gui-e2e-linux:
    name: GUI end-to-end (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            x11-apps \
            xclip \
            xdotool \
            xvfb

      - name: Build
        run: cargo build --locked -p cayenchat-ui

      - name: Check the visual-check session's isolation
        run: python3 -m unittest discover -s scripts/e2e -p 'test_*.py'

      - name: Build and configure Ergo
        run: ERGO_SETUP_ONLY=1 ERGO_NO_FAKELAG=1 scripts/ergo-metadata-interop.sh "$RUNNER_TEMP/ergo" 36667

      - name: Run GUI end-to-end test
        run: >-
          python3 scripts/e2e/history_gui.py
          --app target/debug/cayenchat
          --ergo-dir "$RUNNER_TEMP/ergo"
          --out "$RUNNER_TEMP/e2e"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-e2e-linux
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
