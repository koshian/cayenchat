name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests run only the jobs their changed paths can affect, so a
  # Linux-only or documentation-only change does not wait for Windows and macOS
  # (scripts/ci-jobs.sh). Pushes to master run everything for the beta.
  changes:
    name: Choose jobs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
      gui: ${{ steps.choose.outputs.gui }}
      windows: ${{ steps.choose.outputs.windows }}
      freebsd: ${{ steps.choose.outputs.freebsd }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checked-out commit is the event's pull request merge commit;
          # its first parent is the base it was merged into.
          fetch-depth: 2
          persist-credentials: false

      - name: Test job selection
        run: scripts/test-ci-jobs.sh

      - name: Check SPDX license identifiers
        run: scripts/check-spdx.sh

      - name: Test release checks
        run: scripts/test-release.sh

      # Diff the commit the other jobs build, not the live pull request, so a
      # push made while this run waits cannot change the answer. --no-renames
      # lists both the old and the new path of a rename.
      - name: Choose jobs
        id: choose
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            git diff --name-only --no-renames HEAD^1 HEAD | scripts/ci-jobs.sh | tee -a "$GITHUB_OUTPUT"
          else
            scripts/ci-jobs.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      # Restored caches are read-only for pull requests; only master saves, so
      # a pull request cannot plant build output that master later reuses.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build
        run: cargo build --workspace --locked --verbose

      # Each platform compiles its own `cfg` code, so lint it on every one.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The default member is only the UI crate; test every crate so storage,
      # upload, irc-core and app also run on each platform.
      - name: Test
        id: test
        run: cargo test --workspace --locked --verbose

      # The UI test binary has died on Windows ARM64 with 0xc0000005 (#659).
      # libtest prints a test's name only when it ends, so the log cannot say
      # which one crashed. Run the UI tests again one at a time, where each
      # name is printed before it starts, to find the one that crashes.
      - name: Find the crashing UI test (Windows ARM64)
        if: failure() && steps.test.outcome == 'failure' && matrix.os == 'windows-11-arm'
        run: cargo test -p cayenchat-ui --bin cayenchat --locked -- --test-threads=1 --nocapture

      # The vendored XIM client is outside the workspace; keep its decoder tests.
      # XIM is only used on X11, and the crate does not resolve on other hosts.
      - name: Test vendored zed-xim
        if: runner.os == 'Linux'
        run: cargo test -p zed-xim --locked

      - name: Test vendored irc-proto
        run: cargo test -p irc-proto --locked

      # Probes the real Windows Credential Manager through the keyring crate.
      - name: Test system credential store
        if: runner.os == 'Windows'
        run: cargo test -p cayenchat-storage --locked -- --ignored --nocapture

  # The Windows x86_64 release artifact, in its own job so the 12-minute release
  # build runs beside build-and-test instead of after it. Rust defaults to the
  # console subsystem, and that metadata is the cause of the startup terminal,
  # so check the release exe too. Everything runs on the exe built here.
  windows-release-check:
    name: Windows x86_64 release
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build release
        run: cargo build --release --locked -p cayenchat-ui

      - name: Verify Windows release subsystem and version
        shell: pwsh
        run: |
          ./scripts/check-windows-subsystem.ps1 target/release/cayenchat.exe
          $expected = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json |
            ForEach-Object { $_.packages[0].version }
          $info = (Get-Item target/release/cayenchat.exe).VersionInfo
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) {
            throw "Expected version $expected, found $($info.FileVersion) / $($info.ProductVersion)"
          }

      # Builds and signs the throw-away MSIX used to check the packaged
      # login-startup backend (#153); makeappx validates the manifest.
      - name: Build test MSIX
        shell: pwsh
        run: ./scripts/msix-test/build.ps1 -Exe target/release/cayenchat.exe

      - name: Upload test MSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-test
          path: |
            target/tmp/msix-test/CayenChat.Test.msix
            target/tmp/msix-test/test.cer
          if-no-files-found: error

  # Security advisories (RustSec) for every locked dependency, and their
  # licenses against the allow list in deny.toml (D042). Runs on every pull
  # request and push, since new advisories appear without any change here;
  # accepted ones are listed with reasons in deny.toml.
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses

  # The real app under a virtual X display (Xvfb, software Vulkan) against a
  # local Ergo: older history pages keep the view in place, and a reconnect
  # recovers the missed lines where the log was cut off. Linux only: it drives
  # the app with X11 tools (spec/development.md, "GUI end-to-end test").
  gui-e2e-linux:
    name: GUI end-to-end (Linux)
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            x11-apps \
            xclip \
            xdotool \
            xvfb

      - name: Build
        run: cargo build --locked -p cayenchat-ui

      - name: Check the visual-check session's isolation
        run: python3 -m unittest discover -s scripts/e2e -p 'test_*.py'

      - name: Check the screenshot tool
        run: python3 -m unittest discover -s scripts/screenshots -p 'test_*.py'

      - name: Build and configure Ergo
        run: ERGO_SETUP_ONLY=1 ERGO_NO_FAKELAG=1 scripts/ergo-metadata-interop.sh "$RUNNER_TEMP/ergo" 36667

      - name: Run GUI end-to-end test
        run: >-
          python3 scripts/e2e/history_gui.py
          --app target/debug/cayenchat
          --ergo-dir "$RUNNER_TEMP/ergo"
          --out "$RUNNER_TEMP/e2e"

      - name: Run URL bubble GUI test
        run: python3 scripts/e2e/url_bubble_gui.py --app target/debug/cayenchat --session "$RUNNER_TEMP/e2e/url-bubble"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-e2e-linux
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  # FreeBSD shares GPUI's X11/Wayland platform with Linux. Only the build is
  # checked, in a VM: a cross `cargo check` fails on the C dependencies (aws-lc),
  # and the tests and packages are not run or built there. Nobody has started
  # the app on a real FreeBSD (spec/development.md, "Continuous integration").
  freebsd-check:
    name: FreeBSD x86_64 (build only)
    needs: changes
    if: needs.changes.outputs.freebsd == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the build in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.0"
          usesh: true
          # The sources only need to get in; nothing comes back out.
          copyback: false
          prepare: |
            pkg install -y rust pkgconf cmake libxcb libxkbcommon wayland fontconfig freetype2
          run: |
            cargo check --workspace --all-targets --locked
