[package]
name = "shapebench"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[features]
cache = ["cosmic-text/shape-run-cache"]
# Build against a copy of GPUI 0.2.2 (removed from vendor/ in #1144; see Git history) instead; see src/main.rs.
legacy = []

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
cosmic-text = "0.19.0"
