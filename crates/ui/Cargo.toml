[package]
name = "cayenchat-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "GPL-3.0-only AND Apache-2.0"

[package.metadata.deb]
assets = [
  ["target/release/cayenchat", "usr/bin/", "755"],
  ["../../locales/*.json", "usr/share/cayenchat/locales/", "644"],
]

[[bin]]
name = "cayenchat"
path = "src/main.rs"

[dependencies]
cayenchat-app.workspace = true
cayenchat-irc-core.workspace = true
cayenchat-model.workspace = true
cayenchat-storage = { path = "../storage" }
gpui.workspace = true
unicode-segmentation = "1.12"
url = "2.5.8"
serde_json.workspace = true
chrono.workspace = true
sys-locale = "0.3.2"
log = "0.4"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }
# Same version and backend as GPUI's own portal client, so no new crates.
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-util.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"
