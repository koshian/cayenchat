[package]
name = "cayenchat-ui"
version.workspace = true
edition.workspace = true
rust-version = "1.94"
publish.workspace = true
license = "GPL-3.0-only AND Apache-2.0"

[package.metadata.cargo-machete]
ignored = ["native-theme-derive"]

[package.metadata.deb]
assets = [
  ["target/release/cayenchat", "usr/bin/", "755"],
  ["../../locales/*.json", "usr/share/cayenchat/locales/", "644"],
  ["../../assets/linux/cayenchat.desktop", "usr/share/applications/", "644"],
  ["../../assets/icons/cayenchat.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
# The Test Build package (`cayenchat-test`) installs the same paths.
conflicts = "cayenchat-test"

[[bin]]
name = "cayenchat"
path = "src/main.rs"

[dependencies]
cayenchat-app.workspace = true
cayenchat-irc-core.workspace = true
cayenchat-upload.workspace = true
cayenchat-media.workspace = true
cayenchat-model.workspace = true
cayenchat-storage = { path = "../storage" }
gpui.workspace = true
# Pixel buffers for GPUI's `RenderImage`; the same crate GPUI decodes with.
image = { version = "0.25", default-features = false }
# 0.5.8+ uses gpui-pre. Pin the compatible connector AND its core: later
# native-theme 0.5.x releases changed the API used by this connector.
# 0.5.7 calls its SVG rasterizer even with the icon bundles disabled.
native-theme-gpui = { version = "=0.5.7", default-features = false, features = ["svg-rasterize"] }
native-theme = { version = "=0.5.7", default-features = false }
# The core's derive dependency is semver-wide; 0.5.9 silently breaks 0.5.7
# preset resolution, so constrain the transitive macro crate as well.
native-theme-derive = "=0.5.7"
gpui-component = { version = "=0.5.1", default-features = false }
unicode-segmentation = "1.12"
url = "2.5.8"
serde_json.workspace = true
chrono.workspace = true
sys-locale = "0.3.2"
log = "0.4"
# OS notifications: org.freedesktop.Notifications over zbus on Linux/BSD,
# NSUserNotification on macOS, WinRT toasts on Windows.
notify-rust = "4.18"

[features]
# See cayenchat-storage's `test-build`; also marks the window title.
test-build = ["cayenchat-storage/test-build"]
# Measurement and GUI checks only: links to images.cayenchat.test are read
# from $CAYENCHAT_PREVIEW_FIXTURE_DIR instead of the network, and no other
# link is fetched. Never enabled in release builds.
preview-fixture = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }
# Same version and backend as GPUI's own portal client, so no new crates.
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# Packaged (MSIX) login startup through the WinRT StartupTask (#153).
windows = { version = "0.61", default-features = false, features = ["ApplicationModel", "Foundation", "Win32_System_WinRT"] }
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Reads the bundle identifier for notifications; already in GPUI's tree.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString"] }
# Login-item registration (#153).
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
