[package]
name = "cayenchat-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-only AND Apache-2.0"

[[bin]]
name = "cayenchat"
path = "src/main.rs"

[dependencies]
cayenchat-app.workspace = true
cayenchat-irc-core.workspace = true
cayenchat-model.workspace = true
cayenchat-storage = { path = "../storage" }
gpui.workspace = true
unicode-segmentation = "1.12"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"
