[package]
name = "cayenchat-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MPL-2.0"

[dependencies]
cayenchat-model.workspace = true
url = "2.5.8"
# Same blocking client as `upload`: rustls/ring, no compression, no cookies.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Already in the tree through GPUI. Previews decode PNG, JPEG, GIF, WebP, BMP and ICO;
# avatar editing opens BMP and TIFF too (clipboard images), but previews refuse TIFF (D018).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }

[dev-dependencies]
png = "0.18.1"
