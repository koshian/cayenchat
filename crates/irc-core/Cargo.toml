[package]
name = "cayenchat-irc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MPL-2.0"

[dependencies]
cayenchat-model.workspace = true
irc.workspace = true
# Not used directly: enables the codec's legacy charsets for `irc`.
irc-proto.workspace = true
rustls.workspace = true
encoding_rs.workspace = true
tokio.workspace = true
futures-util.workspace = true
base64.workspace = true
chrono.workspace = true
# Overwrites the connection secrets once they are no longer needed.
zeroize = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
stringprep = "0.1"
getrandom = "0.3"
# ECDSA-NIST256P-CHALLENGE: P-256 keys, PEM import and prehash signatures.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }

[dev-dependencies]
# The encodings the application offers, round-tripped through the codec.
cayenchat-storage = { path = "../storage" }
