[package]
name = "cayenchat-storage"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish.workspace = true
license = "MPL-2.0"

[dependencies]
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
chrono.workspace = true
# OS credential stores: Keychain, Credential Manager, freedesktop Secret Service.
keyring = "4.2"
uuid = { version = "1", features = ["v4"] }
# Tells apart the long names that are cut to fit a file name.
sha2 = "0.10"
base64.workspace = true
# Compresses `.cayentheme` files (already in the tree through GPUI).
flate2.workspace = true

# Writes the macOS Keychain item with one call (see `KeyringEntries::write`).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `MoveFileExW` with write-through makes the replacing rename durable.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
# Test builds keep settings and the local credential file in a fresh
# temporary directory per launch and file system-store secrets under a
# separate service, so they never touch a user's real configuration.
test-build = []

[dev-dependencies]
tempfile = "3"
# Checks that `is_bidi_control` here covers the range the display uses.
cayenchat-model.workspace = true
